name: Plugin Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package.v2.json'
      - 'package.v3.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip

      - name: Check plugin versions
        run: python .github/scripts/check_plugin_versions.py package.json package.v2.json package.v3.json

      - name: Build and release changed plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Track processed tags to avoid duplicates across package files.
          : > processed_tags.txt

          build_frontend() {
            local plugin_dir="$1"
            local frontend_dir="$plugin_dir/frontend"
            [ -f "$frontend_dir/package.json" ] || return 0

            if [ ! -f "$frontend_dir/yarn.lock" ]; then
              echo "Frontend lockfile missing: $frontend_dir/yarn.lock" >&2
              exit 1
            fi

            echo "Building frontend in $frontend_dir"
            (cd "$frontend_dir" && yarn --frozen-lockfile && yarn build)

            if [ ! -s "$frontend_dir/dist/assets/remoteEntry.js" ]; then
              echo "Frontend federation entry missing: $frontend_dir/dist/assets/remoteEntry.js" >&2
              exit 1
            fi
          }

          process_package() {
            local pkg_file="$1"
            [ -f "$pkg_file" ] || return 0

            echo "Processing $pkg_file"

            case "$pkg_file" in
              package.json)
                # Default-index implementations need an explicit V2/V3 opt-in before V3 can load them.
                entry_filter='select(.value.release == true and .value.v3 != false and (.value.v3 == true or .value.v2 == true))'
                ;;
              package.v2.json)
                # V3 inherits V2 implementations unless the entry explicitly opts out.
                entry_filter='select(.value.release == true and .value.v3 != false)'
                ;;
              package.v3.json)
                entry_filter='select(.value.release == true)'
                ;;
              *)
                echo "Unsupported package file: $pkg_file" >&2
                exit 2
                ;;
            esac
            mapfile -t entries < <(jq -r "to_entries | map($entry_filter) | .[] | \"\\(.key)|\\(.value.version)\"" "$pkg_file")

            if [ "${#entries[@]}" -eq 0 ]; then
              echo "No plugins with release=true in $pkg_file"
              return 0
            fi

            for entry in "${entries[@]}"; do
              plugin_id="${entry%%|*}"
              plugin_version="${entry##*|}"
              plugin_id_lc="$(echo "$plugin_id" | tr '[:upper:]' '[:lower:]')"

              if ! plugin_dir="$(bash .github/scripts/select_plugin_release_dir.sh "$pkg_file" "$plugin_id_lc")"; then
                echo "Missing plugin directory for $plugin_id in $pkg_file" >&2
                exit 1
              fi

              tag="${plugin_id}_v${plugin_version}"
              asset="${plugin_id_lc}_v${plugin_version}.zip"
              release_notes="$(jq -r --arg plugin_id "$plugin_id" --arg version "v$plugin_version" '.[$plugin_id].history[$version] // empty' "$pkg_file")"
              if [ -z "$release_notes" ]; then
                release_notes="Automated release of $plugin_id $plugin_version"
              fi

              if grep -qxF "$tag" processed_tags.txt; then
                echo "Tag $tag already processed, skip."
                continue
              fi

              # 同名插件可能跨代维护独立版本线；已有当前版本 tag 时用它判断该代目录是否变化。
              if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                prev_tag="$tag"
              else
                prev_tag="$(git tag --list "${plugin_id}_v*" --sort=-version:refname | head -n 1 || true)"
              fi

              changed=1
              if [ -n "$prev_tag" ]; then
                if git diff --quiet "$prev_tag" -- "$plugin_dir"; then
                  changed=0
                fi
              fi

              if [ "$changed" -eq 0 ]; then
                echo "No changes in $plugin_dir since $prev_tag, skip packaging $plugin_id."
                if gh release view "$tag" >/dev/null 2>&1; then
                  gh release edit "$tag" --notes "$release_notes"
                fi
                echo "$tag" >> processed_tags.txt
                continue
              fi

              echo "Packing $plugin_id from $plugin_dir -> $asset"
              build_frontend "$plugin_dir"
              rm -f "$asset"
              (cd "$(dirname "$plugin_dir")" && zip -r "$GITHUB_WORKSPACE/$asset" "$(basename "$plugin_dir")" -x "*/__pycache__/*" -x "*.pyc" -x "*/node_modules/*") >/dev/null

              # Re-running a version replaces the release asset for that plugin.
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "Release $tag exists, deleting..."
                gh release delete "$tag" -y
                git push origin :refs/tags/"$tag" || true
              fi

              git tag -d "$tag" >/dev/null 2>&1 || true

              echo "Creating release $tag"
              gh release create "$tag" "$asset" --title "$tag" --notes "$release_notes" --latest --target "$GITHUB_SHA"

              echo "$tag" >> processed_tags.txt
            done
          }

          process_package "package.json"
          process_package "package.v2.json"
          process_package "package.v3.json"
